% ==============================================================================
% MMWAVE IWR1843 CASO-CFAR & SURFACE PERCEPTION CONFIGURATION PROFILE
% ==============================================================================
% Hardware: IWR1843BOOST / IWR1843-ISK (3 TX, 4 RX -> 12 Virtual Antennas)
% CFAR Engine: HWA Hardware Accelerator (Mode 2: CASO - Cell Average Smallest Of)
% Detection Output: TLV 20 (customObstacles 3D Bounding Boxes & Surface)
% ==============================================================================

sensorStop
flushCfg
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
adcbufCfg -1 0 1 1 1

% Profile configuration (77 GHz, 100 sweeps, idle 100 us, ramp 60 us, freq slope 29.98 MHz/us)
profileCfg 0 77 100 7 60 0 0 29.982 1 256 5000 0 0 30

% Chirp configuration (TDM-MIMO 3 TX)
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4

% Frame configuration: 20 Hz (50 ms frame period)
frameCfg 0 2 16 0 50 1 0

% Low power mode disabled
lowPower 0 0

% GUI Monitor configuration:
% <subFrameIdx> <detectedObjects> <logMagRange> <noiseProfile> <rangeAzimuthHeatMap> <rangeDopplerHeatMap> <statsInfo> [radarCube] [customObstacles]
% Enable customObstacles (TLV 20)
guiMonitor -1 1 0 0 0 0 0 0 1

% Range & Doppler CASO-CFAR Configuration on HWA
% Syntax: cfarCfg <subFrameIdx> <procDirection> <averageMode> <winLen> <guardLen> <noiseDiv> <cyclicMode> <thresholdScale> <peakGroupingEn>
% Note: averageMode = 2 selects CASO (Hardware Cell Average Smallest Of)
% Stage 1: Range Domain CASO-CFAR (threshold = 14.0 dB)
cfarCfg -1 0 2 8 4 3 0 14.0 0

% Stage 2: Doppler Domain CASO-CFAR (threshold = 13.0 dB)
cfarCfg -1 1 2 4 2 2 1 13.0 0

% Range & Doppler Field Of View (FOV)
cfarFovCfg -1 0 0.15 8.64
cfarFovCfg -1 1 -3.0 3.0

% Angle of Arrival Field Of View (FOV)
% Syntax: aoaFovCfg <subFrameIdx> <minAzimuthDeg> <maxAzimuthDeg> <minElevationDeg> <maxElevationDeg>
aoaFovCfg -1 -90.0 90.0 -90.0 90.0

% Static Clutter Removal: DISABLED (0) to preserve stationary obstacles
clutterRemoval -1 0

% Calibrate DC Range Signature: DISABLED
calibDcRangeSig -1 0 -5 8 256

% Sensor start
sensorStart
